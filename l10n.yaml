arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart

# Workaround for https://github.com/flutter/flutter/issues/188757
# gen-l10n still generates GlobalMaterialLocalizations /
# GlobalCupertinoLocalizations from flutter_localizations, which are
# deprecated since Flutter 3.50 in favor of material_ui / cupertino_ui.
# Suppress those two warnings in the generated file until the generator
# is updated upstream.
header: |
  // ignore_for_file: deprecated_member_use