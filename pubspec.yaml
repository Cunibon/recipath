name: recipath
description: "An open-source app that helps you manage your recipes."

publish_to: 'none'

version: 1.11.2+63

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter  
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  sentry_flutter: ^9.6.0
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^4.0.0
  freezed: ^4.0.0
  go_router: ^17.0.1
  localstorage: ^6.0.0
  path_provider: ^2.1.5
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  random_string: ^2.3.1
  image_picker: ^1.1.2
  intl: ^0.20.2
  file_picker: ^12.0.0
  share_plus: ^13.3.0
  drift: ^2.28.0
  drift_flutter: ^0.3.1
  path: ^1.9.1
  duration_picker: ^1.2.0
  fl_chart: ^1.0.0
  mobile_scanner: ^7.0.1
  http: ^1.4.0
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  supabase_flutter: ^2.9.1
  logger: ^2.6.1
  flutter_image_compress: ^2.5.0
  dynamic_color: ^2.1.0
  purchases_flutter: ^10.4.1
  flutter_launcher_icons: ^0.14.4
  package_info_plus: ^10.2.1
  purchases_ui_flutter: ^10.4.1
  flutter_colorpicker: ^1.1.0
  wakelock_plus: ^1.4.0
  flutter_local_notifications: ^22.3.0
  receive_sharing_intent: ^1.9.0
  app_links: ^7.0.0
  connectivity_plus: ^7.0.0
  timezone: ^0.11.0
  flutter_timezone: ^5.0.1
  audioplayers: ^6.5.1
  flutter_secure_storage: ^11.0.0
  genkit: ^0.15.1
  genkit_openai: ^0.3.7
  genkit_anthropic: ^0.2.11
  genkit_google_genai: ^0.2.12
  schemantic: ^0.2.2
  html: ^0.15.6
  pdf: ^3.12.0
  dotted_border: ^3.1.0
  fast_immutable_collections: ^11.2.0
  smart_input_fields: ^1.0.0
  gal: ^2.3.2
  bound_mutation: ^2.2.0

  material_ui: ^1.0.1
  cupertino_ui: ^1.0.0
  
dev_dependencies:
  sentry_dart_plugin: ^3.1.1
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.0+1
  build_runner: ^2.5.4
  flutter_gen_runner: ^5.12.0
  riverpod_lint: ^3.1.0
  json_serializable: ^6.9.5
  drift_dev: ^2.28.0
  golden_screenshot: ^12.0.0
  image: ^4.8.0
  path_provider_platform_interface: ^2.1.3

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/empty.png
    - assets/sounds/step_done.wav
    - assets/structured_output/recipe_schema.json
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Bold.ttf

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

sentry:
  upload_debug_symbols: true
  upload_source_maps: true
  project: flutter
  org: cunibon-games
